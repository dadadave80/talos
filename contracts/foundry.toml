[profile.default]
solc = "0.8.36"
src = "src"
out = "out"
libs = ["lib"]
optimizer_runs = 200
remappings = [
    '@lattice/=lib/lattice/src/',
    '@diamond/=lib/lattice/lib/diamond-lib/src/',
    '@lattice-script/=lib/lattice/script/',
    '@lattice-test/=lib/lattice/test/',
    'forge-std/=lib/lattice/lib/forge-std/src/',
]
ffi = true
fs_permissions = [{ access = "read", path = "out" }]

[rpc_endpoints]
arc-testnet = "${ARC_TESTNET_RPC}"   # chain 5042002
arc-mainnet = "${ARC_MAINNET_RPC}"   # chain 5042
